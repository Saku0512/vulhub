name: Publish File Browser images once

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-filebrowser-images-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - 2.63.5
          - 2.63.6
    steps:
      - name: Check out the reviewed source snapshot
        uses: actions/checkout@v6
        with:
          ref: a94285e057faee8c7232e100116dc750cf17e257

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish File Browser ${{ matrix.version }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: base/filebrowser/${{ matrix.version }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/saku0512/reprokit-filebrowser:${{ matrix.version }}-a94285e
          labels: |
            org.opencontainers.image.source=https://github.com/Saku0512/vulhub
            org.opencontainers.image.revision=a94285e057faee8c7232e100116dc750cf17e257
            org.opencontainers.image.version=${{ matrix.version }}

      - name: Record published digest
        run: echo "${{ matrix.version }} ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
